name: Terraform Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-dev.yml"
      - ".github/workflows/deploy-dev.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-dev.yml"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Run terraform plan against the dev AWS account"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
  TF_VAR_artifacts_bucket_name: ${{ secrets.TF_VAR_ARTIFACTS_BUCKET_NAME }}
  TF_VAR_budget_alert_emails: ${{ secrets.TF_VAR_BUDGET_ALERT_EMAILS }}

jobs:
  validate:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform fmt check
        run: terraform fmt -recursive -check

      - name: Init backend bootstrap without remote backend
        run: terraform -chdir=backend init -backend=false

      - name: Validate backend bootstrap
        run: terraform -chdir=backend validate

      - name: Init dev without remote backend
        run: terraform -chdir=environments/dev init -backend=false

      - name: Validate dev
        run: terraform -chdir=environments/dev validate

  plan:
    name: Terraform dev plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.run_plan == true
    permissions:
      contents: read
      id-token: write
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required CI secrets
        run: |
          test -n "$AWS_ROLE_TO_ASSUME"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_LOCK_TABLE"
          test -n "$TF_VAR_artifacts_bucket_name"
          test -n "$TF_VAR_budget_alert_emails"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Generate uncommitted backend override
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Init dev remote backend
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Validate dev
        run: terraform validate

      - name: Plan dev
        run: terraform plan -no-color
