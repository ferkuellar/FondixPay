<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FONDIX CRM — Operations</title>

<link rel="stylesheet" href="../../colors_and_type.css"/>

<style>
  /* ============================================================
     FONDIX CRM — local tokens (extends colors_and_type.css)
  ============================================================ */
  :root {
    --accent:      #1565E8;
    --accent-tint: #1565E815;
    --ease-out:    cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* LIGHT theme — applied to root */
  html[data-theme="light"] {
    --surf-0:   #FFFFFF;   /* page bg + cards */
    --surf-1:   #FFFFFF;   /* elevated card */
    --surf-2:   #F4F8FF;   /* sunken row / chip bg */
    --surf-3:   #E2EAF4;   /* track / divider chip */
    --border:   #E2EAF4;
    --fg-1:     #0A1628;
    --fg-2:     #4E6788;
    --fg-3:     #7A95B8;

    --side-bg:      #0A1628;
    --side-fg:      #E2EAF4;
    --side-muted:   #7A95B8;
    --side-border:  rgba(255,255,255,.06);
    --side-hover:   rgba(255,255,255,.05);
    --side-active:  rgba(21,101,232,.18);

    --top-bg: #FFFFFF;
    --page-bg: #F8FAFD;
  }

  /* DARK theme */
  html[data-theme="dark"] {
    --surf-0:   #0F1E36;
    --surf-1:   #142848;
    --surf-2:   #0A1628;
    --surf-3:   #1B335A;
    --border:   #25426F;
    --fg-1:     #E2EAF4;
    --fg-2:     #7A95B8;
    --fg-3:     #4E6788;

    --side-bg:      #050C1A;
    --side-fg:      #E2EAF4;
    --side-muted:   #7A95B8;
    --side-border:  rgba(255,255,255,.06);
    --side-hover:   rgba(255,255,255,.05);
    --side-active:  rgba(21,101,232,.22);

    --top-bg: #0F1E36;
    --page-bg: #050C1A;
  }

  html[data-density="compact"] {
    --row-pad: 8px 12px;
  }
  html[data-density="comfy"] {
    --row-pad: 13px 14px;
  }
  html { --row-pad: 13px 14px; }

  /* ============================================================
     Base
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--fg-1);
    background: var(--page-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ============================================================
     Shell
  ============================================================ */
  .crm-app {
    display: grid;
    grid-template-columns: 248px 1fr;
    min-height: 100vh;
  }

  .crm-sidebar {
    background: var(--side-bg);
    color: var(--side-fg);
    border-right: 1px solid var(--side-border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .crm-main {
    display: flex;
    flex-direction: column;
    min-width: 0;     /* allow children to shrink */
  }

  .crm-topbar {
    height: 60px;
    background: var(--top-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .crm-content {
    flex: 1;
    padding: 26px 28px 60px;
    min-width: 0;
  }

  /* ============================================================
     Sidebar links
  ============================================================ */
  .side-link {
    display: flex; align-items: center; gap: 11px;
    width: 100%;
    padding: 9px 12px;
    background: transparent;
    border: none;
    border-radius: 9px;
    color: var(--side-muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, color .15s;
    text-align: left;
  }
  .side-link:hover { background: var(--side-hover); color: var(--side-fg); }
  .side-link[data-active="true"] {
    background: var(--side-active);
    color: var(--side-fg);
    font-weight: 600;
  }
  .side-link[data-active="true"] svg { color: var(--accent); }

  .side-badge {
    font-size: 10.5px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 1px 7px;
    border-radius: 99px;
    font-family: var(--font-mono);
  }

  /* ============================================================
     Form inputs / buttons
  ============================================================ */
  .input-base {
    background: var(--surf-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 13px;
    font-family: inherit;
    font-size: 13px;
    color: var(--fg-1);
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .input-base::placeholder { color: var(--fg-3); }
  .input-base:focus {
    border-color: var(--accent);
    background: var(--surf-0);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--fg-2);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { background: var(--surf-2); color: var(--fg-1); border-color: var(--border); }

  .select-mini {
    background: var(--surf-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 12px;
    color: var(--fg-1);
    cursor: pointer;
  }

  .quick-pill {
    background: var(--surf-2);
    border: 1px solid var(--border);
    color: var(--fg-1);
    padding: 6px 11px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .quick-pill:hover { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }

  /* ============================================================
     Data table
  ============================================================ */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table thead th {
    text-align: left;
    padding: 11px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--fg-2);
    font-weight: 600;
    background: var(--surf-2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .data-table tbody td {
    padding: var(--row-pad);
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--fg-1);
  }
  .data-table tbody tr { transition: background .12s; }
  .data-table tbody tr:hover { background: var(--surf-2); }
  .data-table tbody tr:last-child td { border-bottom: none; }

  .mono-cell {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--fg-2);
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     Grids
  ============================================================ */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  @media (max-width: 1500px) {
    .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: 1fr 1fr; }
    .charts-row { grid-template-columns: 1fr !important; }
    .kanban-grid { grid-template-columns: 1fr 1fr !important; }
    .chat-grid { grid-template-columns: 1fr !important; }
    .kyc-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 1100px) {
    .chat-grid { grid-template-columns: 280px 1fr !important; }
    .chat-grid > div:nth-child(3) { display: none !important; }
  }
  @media (max-width: 1100px) {
    .crm-app { grid-template-columns: 64px 1fr; }
    .crm-sidebar .side-link span,
    .crm-sidebar .side-badge,
    .crm-sidebar > div:first-child > div,
    .crm-sidebar > div:last-child > div { display: none; }
    .crm-sidebar { padding: 0; }
  }

  /* ============================================================
     Env banner + pills
  ============================================================ */
  .dev-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 22px;
    background: #FEF3C7;
    color: #92560A;
    border-bottom: 1px solid #FCD34D;
    font-size: 12.5px;
    font-weight: 500;
  }
  html[data-theme="dark"] .dev-banner {
    background: rgba(245, 158, 11, 0.15);
    color: #FCD34D;
    border-bottom-color: rgba(245, 158, 11, 0.35);
  }
  .dev-banner-close {
    background: transparent; border: none; color: inherit;
    cursor: pointer; padding: 4px; border-radius: 6px;
    display: inline-flex; opacity: .6;
    transition: opacity .15s, background .15s;
  }
  .dev-banner-close:hover { opacity: 1; background: rgba(0,0,0,.06); }

  .env-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .env-pill-warn {
    background: #FEF3C7;
    color: #92560A;
    border: 1px solid #FCD34D;
  }
  html[data-theme="dark"] .env-pill-warn {
    background: rgba(245, 158, 11, .14);
    color: #FCD34D;
    border-color: rgba(245, 158, 11, .35);
  }
  .env-pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #F59E0B;
    box-shadow: 0 0 0 2px rgba(245,158,11,.25);
  }
  .env-pill-role {
    background: var(--surf-2);
    color: var(--fg-2);
    border: 1px solid var(--border);
  }
  .logout-btn {
    background: var(--surf-0);
    border: 1px solid var(--border);
    color: var(--fg-1);
    padding: 6px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .logout-btn:hover { background: var(--surf-2); border-color: var(--fg-3); }

  /* ============================================================
     Misc
  ============================================================ */
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--fg-3);
    display: inline-block;
    animation: t-dot 1.2s ease-in-out infinite;
  }
  @keyframes t-dot {
    0%,100% { opacity: .3; transform: translateY(0); }
    50%     { opacity: 1; transform: translateY(-3px); }
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Tweaks panel default style overrides (subtle tweaks for FONDIX) */
  body { background: var(--page-bg); }
</style>
</head>
<body>
<div id="root"></div>

</body>
