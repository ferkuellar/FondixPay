
<style>
.sp{cursor:pointer;stroke:#fff;stroke-width:0.6;transition:opacity .15s;}
.sp:hover{opacity:0.78;}
#tt{position:absolute;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:10px;padding:10px 14px;font-size:12px;pointer-events:none;display:none;z-index:10;min-width:200px;max-width:240px;line-height:1.5;}
#detail{background:var(--color-background-secondary);border-radius:12px;padding:14px 18px;margin-top:12px;font-size:13px;display:none;}
.svc-pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin:2px 3px 2px 0;font-weight:500;}
.leg-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 4px;font-size:11px;color:var(--color-text-secondary);}
.swatch{display:inline-block;width:16px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px;}
#loading-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--color-text-secondary);}
</style>

<h2 class="sr-only">Mapa interactivo de cobertura FONDIX PAY — República Mexicana</h2>

<div style="position:relative;width:100%;min-height:420px;">
  <svg id="mxmap" width="100%" viewBox="0 0 680 440" style="display:block;"></svg>
  <div id="loading-msg"><i class="ti ti-loader" style="font-size:18px;" aria-hidden="true"></i> Cargando mapa…</div>
  <div id="tt"></div>
</div>

<div class="leg-row" id="legend-row">
  <span style="font-weight:500;color:var(--color-text-primary);">Servicios locales/regionales:</span>
</div>

<div id="detail">
  <p style="margin:0;font-size:12px;color:var(--color-text-secondary);">Haz clic en un estado para ver sus servicios disponibles.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const NATIONAL = 38;

const stateNames = {
  AGS:"Aguascalientes",BCN:"Baja California",BCS:"Baja California Sur",
  CAM:"Campeche",CHP:"Chiapas",CHH:"Chihuahua",CMX:"Ciudad de México",
  COA:"Coahuila",COL:"Colima",DGO:"Durango",GTO:"Guanajuato",
  GRO:"Guerrero",HGO:"Hidalgo",JAL:"Jalisco",MEX:"Estado de México",
  MCH:"Michoacán",MOR:"Morelos",NAY:"Nayarit",NLE:"Nuevo León",
  OAX:"Oaxaca",PUE:"Puebla",QRO:"Querétaro",ROO:"Quintana Roo",
  SLP:"San Luis Potosí",SIN:"Sinaloa",SON:"Sonora",TAB:"Tabasco",
  TAM:"Tamaulipas",TLX:"Tlaxcala",VER:"Veracruz",YUC:"Yucatán",ZAC:"Zacatecas"
};

const normalize = s => s.toLowerCase()
  .replace(/[áà]/g,"a").replace(/[éè]/g,"e").replace(/[íì]/g,"i")
  .replace(/[óò]/g,"o").replace(/[úù]/g,"u").replace(/ñ/g,"n").trim();

const nameMap = {
  "aguascalientes":"AGS","baja california":"BCN","baja california sur":"BCS",
  "campeche":"CAM","chiapas":"CHP","chihuahua":"CHH",
  "ciudad de mexico":"CMX","distrito federal":"CMX","ciudad de méxico":"CMX",
  "coahuila":"COA","coahuila de zaragoza":"COA","colima":"COL","durango":"DGO",
  "guanajuato":"GTO","guerrero":"GRO","hidalgo":"HGO","jalisco":"JAL",
  "mexico":"MEX","estado de mexico":"MEX","michoacan":"MCH","michoacan de ocampo":"MCH",
  "morelos":"MOR","nayarit":"NAY","nuevo leon":"NLE","oaxaca":"OAX","puebla":"PUE",
  "queretaro":"QRO","quintana roo":"ROO","san luis potosi":"SLP",
  "sinaloa":"SIN","sonora":"SON","tabasco":"TAB","tamaulipas":"TAM",
  "tlaxcala":"TLX","veracruz":"VER","veracruz de ignacio de la llave":"VER",
  "yucatan":"YUC","zacatecas":"ZAC"
};

function getCode(props) {
  const keys = ["name","Name","NAME","state_name","NOMBRE","NOM_ENT","admin"];
  for(const k of keys) {
    if(props[k]) {
      const n = normalize(props[k]);
      if(nameMap[n]) return nameMap[n];
    }
  }
  return null;
}

const svcs = [
  {n:"IZZI",           a:"TELECOMS", st:["CMX","MEX","MOR","PUE","HGO","VER","OAX","CHP","TAB","CAM","YUC","ROO","GRO","COL","JAL","NAY"]},
  {n:"Megacable",      a:"TELECOMS", st:["JAL","GTO","AGS","COL","MCH","QRO","MEX","CMX","SIN","SON","NAY","DGO","ZAC","SLP","HGO"]},
  {n:"Totalplay",      a:"TELECOMS", st:["CMX","MEX","NLE","JAL","GTO","PUE","QRO","AGS","COA","CHH","TAM","SLP","HGO","MOR"]},
  {n:"Axtel",          a:"TELECOMS", st:["CHH","COA","NLE","TAM","DGO","SON","SIN","ZAC","SLP","AGS","GTO","QRO","CMX","MEX","HGO","JAL"]},
  {n:"Maxcom",         a:"TELECOMS", st:["CMX","MEX"]},
  {n:"Cablemas",       a:"TELECOMS", st:["JAL","GTO","MCH","AGS","COL","NAY","QRO","CMX","MEX"]},
  {n:"Cablevision",    a:"TELECOMS", st:["CMX","MEX"]},
  {n:"Multimedios",    a:"TELECOMS", st:["NLE","TAM","COA","CHH","DGO","ZAC"]},
  {n:"Telnor",         a:"TELECOMS", st:["BCN","BCS","SON"]},
  {n:"Gas del Noreste",a:"GAS",      st:["NLE","COA","TAM","CHH","DGO","ZAC","SLP","AGS"]},
  {n:"Ecogas",         a:"GAS",      st:["NLE","COA","TAM","CHH","DGO","SLP","ZAC"]},
  {n:"Agua Chihuahua", a:"AGUA",     st:["CHH"]},
  {n:"Agua CDMX",      a:"AGUA",     st:["CMX"]},
  {n:"Agua Monterrey", a:"AGUA",     st:["NLE"]},
  {n:"Agua Guadalajara",a:"AGUA",    st:["JAL"]},
  {n:"Agua Puebla",    a:"AGUA",     st:["PUE"]},
  {n:"Agua Querétaro", a:"AGUA",     st:["QRO"]},
  {n:"Agua Saltillo",  a:"AGUA",     st:["COA"]},
  {n:"Agua Tijuana",   a:"AGUA",     st:["BCN"]},
  {n:"Agua Cancún",    a:"AGUA",     st:["ROO"]},
  {n:"Agua Acapulco",  a:"AGUA",     st:["GRO"]},
  {n:"Agua Celaya",    a:"AGUA",     st:["GTO"]},
  {n:"Agua Irapuato",  a:"AGUA",     st:["GTO"]},
  {n:"Agua Salamanca", a:"AGUA",     st:["GTO"]},
  {n:"Agua SLP",       a:"AGUA",     st:["SLP"]},
  {n:"Agua Torreón",   a:"AGUA",     st:["COA"]},
  {n:"Agua Nvo Laredo",a:"AGUA",     st:["TAM"]},
  {n:"Agua Vallarta",  a:"AGUA",     st:["JAL"]},
  {n:"Agua Durango",   a:"AGUA",     st:["DGO"]},
  {n:"Agua Aguascalientes",a:"AGUA", st:["AGS"]},
  {n:"Agua Campeche",  a:"AGUA",     st:["CAM"]},
  {n:"Agua Progreso",  a:"AGUA",     st:["YUC"]},
  {n:"Agua Hidalgo",   a:"AGUA",     st:["HGO"]},
  {n:"Tesorería CHH",  a:"GOBIERNO", st:["CHH"]},
  {n:"Tesorería ZAC",  a:"GOBIERNO", st:["ZAC"]},
  {n:"Finanzas GTO",   a:"GOBIERNO", st:["GTO"]},
  {n:"Finanzas JAL",   a:"GOBIERNO", st:["JAL"]},
  {n:"Finanzas MEX",   a:"GOBIERNO", st:["MEX"]},
  {n:"Finanzas QRO",   a:"GOBIERNO", st:["QRO"]},
  {n:"Finanzas MCH",   a:"GOBIERNO", st:["MCH"]},
  {n:"Finanzas COA",   a:"GOBIERNO", st:["COA"]},
  {n:"Finanzas TLX",   a:"GOBIERNO", st:["TLX"]},
  {n:"Finanzas TAM",   a:"GOBIERNO", st:["TAM"]},
  {n:"Finanzas OAX",   a:"GOBIERNO", st:["OAX"]},
  {n:"Finanzas HGO",   a:"GOBIERNO", st:["HGO"]},
  {n:"Finanzas TAB",   a:"GOBIERNO", st:["TAB"]},
  {n:"Predial Celaya", a:"GOBIERNO", st:["GTO"]},
  {n:"Predial Tijuana",a:"GOBIERNO", st:["BCN"]},
  {n:"Mun. León",      a:"GOBIERNO", st:["GTO"]},
  {n:"Mun. Querétaro", a:"GOBIERNO", st:["QRO"]},
  {n:"Mun. Reynosa",   a:"GOBIERNO", st:["TAM"]},
];

const extras = {};
const extraDetail = {};
for(const svc of svcs) {
  for(const st of svc.st) {
    extras[st] = (extras[st]||0)+1;
    if(!extraDetail[st]) extraDetail[st] = [];
    extraDetail[st].push({n:svc.n, a:svc.a});
  }
}

const maxE = Math.max(...Object.values(extras));
const colors = ["#E6F1FB","#B5D4F4","#6EA8DC","#378ADD","#185FA5","#0C447C","#042C53"];
const colorScale = d3.scaleQuantize().domain([0, maxE]).range(colors);

const areaStyle = {
  TELECOMS:{bg:"#EEEDFE",fg:"#3C3489"},
  GAS:     {bg:"#FAEEDA",fg:"#633806"},
  AGUA:    {bg:"#E6F1FB",fg:"#0C447C"},
  GOBIERNO:{bg:"#FAECE7",fg:"#712B13"},
};

const svg = d3.select("#mxmap");
const projection = d3.geoMercator();
const pathGen = d3.geoPath(projection);
const tt = document.getElementById("tt");
const detail = document.getElementById("detail");

fetch("https://cdn.jsdelivr.net/npm/datamaps@0.5.10/src/js/data/mex.topo.json")
  .then(r => r.json())
  .then(topo => {
    document.getElementById("loading-msg").style.display = "none";
    const objKey = Object.keys(topo.objects)[0];
    const features = topojson.feature(topo, topo.objects[objKey]).features;

    projection.fitExtent([[20,10],[660,430]], {type:"FeatureCollection", features});

    svg.selectAll(".sp")
      .data(features)
      .join("path")
      .attr("class","sp")
      .attr("d", pathGen)
      .attr("fill", d => {
        const code = getCode(d.properties);
        return colorScale(extras[code]||0);
      })
      .on("mousemove", function(evt, d) {
        const code = getCode(d.properties);
        const name = stateNames[code] || d.properties.name || d.properties.Name || "";
        const ex = extras[code]||0;
        const total = NATIONAL + ex;
        tt.style.display = "block";
        tt.style.left = Math.min(evt.offsetX+14, 460)+"px";
        tt.style.top  = Math.max(evt.offsetY-60, 10)+"px";
        tt.innerHTML = `<div style="font-weight:500;font-size:13px;margin-bottom:4px;">${name}</div>
          <div style="color:var(--color-text-secondary);">
            <span style="color:#185FA5;font-weight:500;">${total}</span> servicios disponibles
          </div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-top:3px;">
            ${NATIONAL} nacionales + <strong style="color:#0C447C">${ex}</strong> locales/regionales
          </div>
          <div style="font-size:11px;margin-top:4px;color:#185FA5;">Clic para ver detalle →</div>`;
      })
      .on("mouseleave", () => { tt.style.display = "none"; })
      .on("click", (evt, d) => {
        const code = getCode(d.properties);
        if(!code) return;
        const name = stateNames[code] || "";
        const ex = extras[code]||0;
        const total = NATIONAL + ex;
        const byArea = {};
        for(const s of (extraDetail[code]||[])) {
          if(!byArea[s.a]) byArea[s.a]=[];
          byArea[s.a].push(s.n);
        }
        let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          <div style="width:16px;height:16px;border-radius:4px;background:${colorScale(ex)};border:0.5px solid #ccc;flex-shrink:0;"></div>
          <div>
            <span style="font-size:15px;font-weight:500;">${name}</span>
            <span style="font-size:12px;color:var(--color-text-secondary);margin-left:8px;">${total} servicios totales</span>
          </div>
        </div>
        <div style="background:var(--color-background-primary);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;">
          <span style="color:var(--color-text-secondary);">Nacionales (todos los estados): </span>
          <strong>${NATIONAL}</strong>
          <span style="color:var(--color-text-secondary);font-size:11px;"> — CFE, Telmex, Telcel, Netflix, Spotify, Gas LP, Sky, TAE, INFONAVIT…</span>
        </div>`;

        if(ex > 0) {
          html += `<div style="font-size:12px;font-weight:500;margin-bottom:6px;">Servicios locales / regionales exclusivos (${ex}):</div>`;
          for(const [area, names] of Object.entries(byArea)) {
            const {bg, fg} = areaStyle[area]||{bg:"#eee",fg:"#333"};
            html += `<div style="margin-bottom:8px;">
              <span style="display:inline-block;background:${bg};color:${fg};font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;margin-bottom:4px;">${area}</span><br>`;
            for(const n of names) {
              html += `<span class="svc-pill" style="background:${bg};color:${fg};">${n}</span>`;
            }
            html += "</div>";
          }
        } else {
          html += `<div style="font-size:12px;color:var(--color-text-secondary);padding:6px 0;">Solo servicios nacionales. No hay agua, gobierno local, ni telecomunicaciones regionales disponibles aún en el catálogo.</div>`;
        }
        detail.style.display = "block";
        detail.innerHTML = html;
        svg.selectAll(".sp").attr("stroke-width", f => getCode(f.properties)===code ? 2 : 0.6)
          .attr("stroke", f => getCode(f.properties)===code ? "#1E3A5F" : "#fff");
      });

    const legRow = document.getElementById("legend-row");
    const thresholds = [0,...colorScale.thresholds()];
    legRow.innerHTML = '<span style="font-weight:500;color:var(--color-text-primary);font-size:12px;">Servicios locales:</span> ' +
      colors.map((c,i) => {
        const lo = thresholds[i]!==undefined ? Math.ceil(thresholds[i]) : 0;
        const hi = thresholds[i+1]!==undefined ? Math.floor(thresholds[i+1]-0.01) : maxE;
        const label = i===0 ? "Solo nacionales" : `+${lo}–${hi} extra`;
        return `<span><span class="swatch" style="background:${c};"></span>${label}</span>`;
      }).join(" ");
  })
  .catch(() => {
    document.getElementById("loading-msg").textContent = "Error al cargar el mapa. Verifica tu conexión.";
  });
</script>
